# Typecheck, lint and the test suite, on every change.
#
# The repository had a workflow for building installers and none for checking
# the code, so "green" meant nothing on a pull request. These are the same
# commands a contributor runs locally, in the same order, so a failure here is
# reproducible with one command rather than by reading the log.
#
# Cost-conscious by design (see docs/OVERVIEW.md §9's "GitHub Actions budget" note):
# PRs only (no duplicate re-run when a merge lands on main — that code already
# passed this exact suite as a required check moments earlier), the `plan` job
# below skips the expensive jobs entirely when a change touches nothing that
# affects build/test output, and the Node matrix is 1 version on a normal PR
# (workflow_dispatch runs the full matrix on demand, at zero passive cost).
name: CI

on:
  pull_request:
  workflow_dispatch:

# A new push supersedes the run in flight for the same PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides, once, what the three jobs below need to know: whether this PR
  # touches anything that could change typecheck/lint/test/build output, and
  # which Node versions to run. A job whose `if` evaluates to false reports
  # as "skipped", which GitHub treats as a passing required status check —
  # so branch protection referencing these jobs' names keeps working exactly
  # as before, it just does none of the expensive work on, say, a docs-only
  # or workflow-comment-only PR.
  plan:
    name: Plan (changed files, Node versions)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.resolve.outputs.code }}
      node-versions: ${{ steps.resolve.outputs.node_versions }}
    steps:
      # Only meaningful for pull_request — there's nothing to diff against
      # for a manual workflow_dispatch run, which always runs everything
      # (see the resolve step below).
      - name: Detect changes that could affect build/test/lint output
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'desktop/**'
              - 'drizzle/**'
              - 'drizzle-pg/**'
              - 'public/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'next.config.*'
              - 'drizzle.config*.ts'
              - 'tailwind.config.*'
              - '.github/workflows/**'

      - name: Resolve outputs
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # A manual run is deliberate — always run everything, and use it
            # as the (infrequent, fully opt-in) way to check Node 24 too.
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "node_versions=[22,24]" >> "$GITHUB_OUTPUT"
          else
            echo "code=${{ steps.filter.outputs.code }}" >> "$GITHUB_OUTPUT"
            echo "node_versions=[22]" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Typecheck, lint and test (Node ${{ matrix.node-version }})
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # package.json advertises Node >=22; a normal PR checks only the floor
      # version (also what the other two jobs below use) to keep per-PR cost
      # down. Node 24 (current latest) is checked by running this workflow's
      # "Run workflow" button manually — see the plan job above.
      matrix:
        node-version: ${{ fromJSON(needs.plan.outputs.node-versions) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # The registry drops connections often enough to matter: a bare `npm ci`
      # failed here with ECONNRESET twenty-three seconds in, before a single
      # test had run, and the job cannot tell that from a real failure. npm's
      # own retry is the fix; the defaults (2 retries, 10s cap) are too meagre
      # for a hosted runner.
      - name: Install dependencies
        run: npm ci --fetch-retries 5 --fetch-retry-mintimeout 20000 --fetch-retry-maxtimeout 120000

      # Reused by both `next build` (inside test:e2e below) and desktop:build
      # — same source, same compiled-module cache either way. A stale or
      # missing cache just means a normal full build, never a wrong one.
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}-

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      # A schema change without its migration and snapshot makes the next
      # `db:generate` write a new migration (or re-create tables that already
      # exist, when snapshots are missing). Run it on this disposable checkout
      # and fail if it wrote anything. `generate` never opens the database;
      # DATABASE_PATH points at the runner's temp dir regardless.
      - name: SQLite migrations are up to date with the schema
        env:
          DATABASE_PATH: ${{ runner.temp }}/drizzle-generate-check.db
        run: |
          npm run db:generate
          changes="$(git status --porcelain --untracked-files=all -- drizzle)"
          if [ -n "$changes" ]; then
            echo "::error title=Migration drift::src/db/schema.ts differs from drizzle/ (migrations + meta snapshots). Run 'npm run db:generate' locally and commit the result."
            echo "$changes"
            exit 1
          fi

      # Only Chromium: the suite drives one browser, and installing the other
      # two would triple the download for no extra coverage. Cached by
      # Playwright version (via the lockfile hash) so a re-run with an
      # unchanged version skips the ~100MB+ browser download entirely.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the browser the end-to-end suite drives
        run: npx playwright install --with-deps chromium

      # Builds the application first, so this also proves the production build.
      - name: End-to-end tests
        run: npm run test:e2e

      # The desktop suite self-skips ("no standalone build") unless the bundle
      # the Electron app ships has been built, so building it is what makes
      # those tests run at all rather than pass vacuously. It also covers the
      # packaging steps — symlink materialisation, the migrations copy, the
      # stray-database removal — that broke Windows builds twice before.
      - name: Build the desktop bundle
        run: npm run desktop:build

      # Electron needs a display even headless.
      - name: Desktop shell tests
        run: xvfb-run -a npm run test:desktop

  # Hosted multi-user mode's Postgres path. Separate job rather than folding
  # into `check`: the SQLite suite above needs no database service at all, and
  # keeping them apart means a Postgres-side failure never blocks the desktop/
  # SQLite signal this repo has relied on so far.
  postgres:
    name: Postgres (hosted multi-user mode)
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ai_dashboard
          POSTGRES_PASSWORD: ai_dashboard_ci
          POSTGRES_DB: ai_dashboard
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://ai_dashboard:ai_dashboard_ci@localhost:5432/ai_dashboard
      # The postgres:16 image's POSTGRES_USER is a real superuser, so this
      # role can create/drop the throwaway databases tests/helpers/db.pg.ts
      # needs — no separate admin credential to manage in CI.
      TEST_DATABASE_ADMIN_URL: postgres://ai_dashboard:ai_dashboard_ci@localhost:5432/postgres
      AUTH_SECRET: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --fetch-retries 5 --fetch-retry-mintimeout 20000 --fetch-retry-maxtimeout 120000

      - name: Migrate the Postgres schema
        run: npm run db:migrate:pg

      # Same drift check as the SQLite one in `check`. drizzle.config.pg.ts
      # needs DATABASE_URL (the job env above); `generate` does not connect.
      - name: Postgres migrations are up to date with the schema
        run: |
          npm run db:generate:pg
          changes="$(git status --porcelain --untracked-files=all -- drizzle-pg)"
          if [ -n "$changes" ]; then
            echo "::error title=Migration drift::src/db/schema.pg.ts differs from drizzle-pg/ (migrations + meta snapshots). Run 'npm run db:generate:pg' locally and commit the result."
            echo "$changes"
            exit 1
          fi

      - name: Postgres-backed tests
        run: npm run test:unit:pg

      - name: Postgres-backed tests (Auth.js)
        run: npm run test:unit:pg:auth

  # Unit tests only, not the full suite above: this exists to catch
  # Windows-specific breakage (path handling, file locking) cheaply, not to
  # duplicate everything the Linux job already covers. Windows runners also
  # bill at 2x the Linux per-minute rate against the included-minutes budget,
  # which is exactly why this stays unit-tests-only rather than growing to
  # match `check`.
  windows-unit:
    name: Unit tests (Windows)
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --fetch-retries 5 --fetch-retry-mintimeout 20000 --fetch-retry-maxtimeout 120000

      - name: Unit tests
        run: npm run test:unit
